# Single-host deployment (§12.5): Postgres + API + web behind nginx.
# Put a TLS-terminating proxy (Caddy, Traefik, a load balancer) in front of `web`.
#   JWT_SECRET=... POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: god
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: god
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U god"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://god:${POSTGRES_PASSWORD}@postgres:5432/god
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random bytes)}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-https://god.example.com}
      PUBLIC_API_URL: ${PUBLIC_WEB_URL:-https://god.example.com}
      COOKIE_SECURE: "true"
      LOG_LEVEL: info

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  pgdata:
