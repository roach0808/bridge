name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: god
          POSTGRES_PASSWORD: god
          POSTGRES_DB: god_testsuite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U god" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://god:god@localhost:5432/god_testsuite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Shared unit tests
        run: pnpm --filter @god/shared test
      - name: API tests
        run: pnpm --filter api test
      - name: Build
        run: pnpm --filter api build && pnpm --filter web build
